<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discovery Call Notes</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #14304d;
    --navy-light: #1f4a75;
    --accent: #5c7248;
    --accent-dark: #46592f;
    --amber: #a9740f;
    --danger: #b3403a;
    --danger-dark: #922f2b;
    --bg: #a3b9aa;
    --card: #ffffff;
    --border: #dde3e9;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }

  #loading-view { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  .util-bar { max-width: 820px; margin: 0 auto; padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .util-bar a.back-link { color: var(--navy-light); font-size: 13px; text-decoration: none; font-weight: 600; }
  .util-bar a.back-link:hover { text-decoration: underline; }
  .util-bar button { font-family: inherit; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--text); border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .util-bar button:hover { background: #eef1f4; }

  .page-shell { max-width: 820px; margin: 16px auto 80px; padding: 0 20px; }

  #banner { display: none; padding: 10px 14px; border-radius: 6px; font-size: 13.5px; margin-bottom: 16px; }
  #banner.error { display: block; background: #fbe9e9; color: #922f2b; border: 1px solid #f0c2c0; }
  #banner.success { display: block; background: #e9f5ee; color: #24614a; border: 1px solid #bfe3cf; }

  .letterhead { background: #fff; border: 1px solid var(--border); border-radius: 10px 10px 0 0; padding: 22px 26px; display: flex; align-items: center; gap: 20px; border-bottom: 4px solid var(--accent); }
  .logo-wrap { flex-shrink: 0; }
  .logo-wrap img { height: 60px; width: auto; display: block; object-fit: contain; }
  .logo-fallback { height: 60px; width: 60px; background: var(--accent); border-radius: 6px; display: none; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
  .letterhead-title h1 { margin: 0 0 2px; font-size: 20px; color: var(--navy); font-weight: 700; }
  .letterhead-title .subtitle { font-size: 12.5px; color: var(--accent-dark); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .letterhead-title .company-name { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .card { background: var(--card); border: 1px solid var(--border); border-top: none; padding: 20px 26px; margin-bottom: 0; }
  .card:last-of-type { border-radius: 0 0 10px 10px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 14px; font-size: 14px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.3px; }

  .info-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; }
  .info-grid dt { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 2px; }
  .info-grid dd { margin: 0; font-size: 13.5px; color: var(--text); white-space: pre-line; }
  .info-grid dd.empty { color: var(--muted); font-style: italic; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field input, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(31,74,117,0.12); }
  .field textarea { resize: vertical; }
  /* Rich-text Notes (10/11/26). Looks like the textarea it replaced, so the
     form still reads as one set of fields. */
  .rt-toolbar { display: flex; gap: 3px; margin-bottom: 6px; flex-wrap: wrap; }
  .rt-toolbar button { min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--border);
                       border-radius: 6px; background: #eef1f4; color: var(--text); font-size: 12.5px;
                       font-weight: 600; font-family: inherit; cursor: pointer;
                       display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .rt-toolbar button:hover { background: #e2e6ea; }
  /* The guide picker (Greg, 10/26/26): "it would be nice to have some
     selectable guides to get us started where you could add additional
     question and delete inappropriate questions."

     Deliberately NOT a fillable form of its own. A discovery call does not
     run in order -- the client answers question seven while you are asking
     question two -- and a page of fixed boxes fights that. The guide drops
     into the notes as ordinary editable text, so a question that does not
     apply gets deleted, one that comes up gets typed in, and the whole
     thing reorders by dragging. It is a starting point, not a script. */
  .guide-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .guide-bar-spacer { flex: 1 1 auto; }
  .guide-bar select {
    height: 28px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px;
    background: #f5f7f9; font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer;
    max-width: 260px;
  }
  .guide-bar button, .guide-editbar button, #guide-show {
    height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #f5f7f9; font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer;
  }
  .guide-bar button:hover, .guide-editbar button:hover, #guide-show:hover { background: #e2e6ea; }
  .guide-bar button:disabled { opacity: 0.5; cursor: default; }
  .guide-editbar .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .guide-editbar .btn-primary:hover { background: var(--accent-dark); }
  #guide-hide { color: var(--muted); font-size: 15px; line-height: 1; padding: 0 9px; }
  .guide-closed { margin-bottom: 14px; }
  .rt-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  .rt-status { font-size: 12px; color: var(--muted); margin-left: 4px; }

  /* One heading per row, all closed to start. A discovery call wanders, so
     the Team Lead opens the heading the conversation has arrived at rather
     than scrolling a page of eighty questions -- Greg: "so that things
     don't get messy as we work our way through the conversation." */
  #guide-panel { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #guide-panel details { border-bottom: 1px solid var(--border); }
  #guide-panel details:last-child { border-bottom: none; }
  #guide-panel summary {
    cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--navy);
    background: #f8fafb; list-style: none; display: flex; align-items: center; gap: 8px;
  }
  #guide-panel summary::-webkit-details-marker { display: none; }
  #guide-panel summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; }
  #guide-panel details[open] > summary::before { content: "\25BE"; }
  #guide-panel summary:hover { background: #eef1f4; }
  #guide-panel .gq-count {
    margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted);
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
  }
  #guide-panel ul { margin: 0; padding: 8px 14px 12px 32px; background: #fff; }
  #guide-panel li { font-size: 13.5px; line-height: 1.5; margin-bottom: 7px; cursor: pointer; }
  #guide-panel li:last-child { margin-bottom: 0; }
  /* Click to strike through what has been covered. Session only, nothing
     saved -- a finger on the page during one call, not a record. The
     notetaker keeps the record. */
  #guide-panel li.covered { color: var(--muted); text-decoration: line-through; }
  #guide-panel.editing li { cursor: text; }
  #guide-panel.editing li[contenteditable] { outline: none; padding: 2px 5px; border-radius: 4px; background: #f7f9fa; }
  #guide-panel.editing li[contenteditable]:focus { background: #fff; box-shadow: 0 0 0 2px rgba(92,114,72,0.3); }
  #guide-panel.editing .gq-heading[contenteditable] { outline: none; padding: 1px 5px; border-radius: 4px; background: #fff; }
  #guide-panel .gq-del {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px;
    padding: 0 4px; line-height: 1;
  }
  #guide-panel .gq-del:hover { color: var(--danger); }
  #guide-panel .gq-add, #guide-panel .gq-add-section {
    border: 1px dashed var(--border); background: #fff; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 3px 9px; border-radius: 6px; margin: 0 0 10px 32px;
  }
  #guide-panel .gq-add:hover, #guide-panel .gq-add-section:hover { color: var(--navy); border-color: var(--navy); }
  #guide-panel .gq-add-section { margin: 10px 12px; }
  .guide-editbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .rt-toolbar button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .rt-editor { width: 100%; min-height: 300px; max-height: 60vh; overflow-y: auto;
               padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
               font-size: 14px; font-family: inherit; line-height: 1.55; background: #fff; }
  .rt-editor:focus { outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(31,74,117,0.12); }
  .rt-editor p { margin: 0 0 8px; }
  .rt-editor p:last-child { margin-bottom: 0; }
  .rt-editor ul, .rt-editor ol { margin: 0 0 8px; padding-left: 22px; }
  .rt-editor ul:last-child, .rt-editor ol:last-child { margin-bottom: 0; }
  .rt-editor li { margin: 0 0 3px; }
  /* An empty contenteditable shows nothing at all, so it needs its own
     placeholder -- :empty alone misses the <br> a browser leaves behind. */
  .rt-editor:empty::before,
  .rt-editor:has(> br:only-child)::before { content: attr(data-placeholder); color: var(--muted); }
  @media print {
    .rt-editor { border: none; padding: 0; max-height: none; overflow: visible; }
  }
  .field-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 200px; }

  .save-row { display: flex; align-items: center; gap: 12px; }
  .save-row button { font-family: inherit; cursor: pointer; border: none; border-radius: 6px; font-size: 13.5px; padding: 10px 20px; font-weight: 600; background: var(--accent); color: #fff; }
  .save-row button:hover { background: var(--accent-dark); }
  .save-row button:disabled { opacity: 0.55; cursor: default; }
  .save-hint { font-size: 12px; color: var(--muted); }

  /* Attach a File or Link for Call Notes -- same upload-or-link + Change
     menu pattern as the Workflow Files page. */
  .wf-btn {
    display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--navy-light);
    border: 1.5px solid var(--navy-light); border-radius: 999px; padding: 7px 16px;
    font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .wf-btn:hover { background: #eef4fb; }
  .wf-file-cell { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wf-file-link { cursor: pointer; color: var(--navy-light); font-weight: 600; font-size: 13px; }
  .wf-file-link:hover { text-decoration: underline; }
  .wf-change-wrap { position: relative; flex-shrink: 0; }
  .wf-menu {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 150px; background: #fff;
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    padding: 6px; z-index: 20;
  }
  .wf-menu button {
    display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 10px;
    border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit;
  }
  .wf-menu button:hover { background: #f4f6f8; }
  .wf-menu button.wf-menu-danger { color: var(--danger); }
  .wf-menu button.wf-menu-danger:hover { background: #fdecea; }

  /* Greg (8/31/26): "wrong. one row = 1 person = 3 fields per person. Add
     Row button." Each CC List entry is its own row of 3 real inputs
     (Name/Title/Email), not one comma-joined line of text. */
  .cc-row { display: grid; grid-template-columns: 1.1fr 1fr 1.4fr auto; gap: 10px 12px; align-items: end; margin-bottom: 10px; }
  .cc-row .field { margin-bottom: 0; }
  .cc-row-remove {
    background: none; border: none; color: var(--danger); font-size: 20px; line-height: 1;
    cursor: pointer; padding: 8px 6px; font-family: inherit;
  }
  .cc-row-remove:hover { color: #b3261e; }
  @media (max-width: 640px) {
    .cc-row { grid-template-columns: 1fr; }
  }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .page-shell { max-width: none; margin: 0; padding: 0; }
    .letterhead, .card { border-color: #ccc; }
  }
  @media (max-width: 640px) {
    .info-grid { grid-template-columns: 1fr; }
    .info-grid dt { padding-top: 8px; }
  }
</style>
</head>

  const escapeHtml = (str) => { const d = document.createElement("div"); d.textContent = str == null ? "" : String(str); return d.innerHTML; };

  // ---------- Notes: rich text in, markdown-lite out ----------
  // The same pair controlling_document.html uses for its Background field,
  // and deliberately the same stored format: discovery_call_notes stays a
  // plain-text column anyone can read in the database or grep, rather than
  // becoming a blob of HTML the moment someone bolds a word.
  function notesTextToHtml(text) {
    if (!text) return "";
    const inline = (x) => escapeHtml(x)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
    const lines = String(text).split(/\r?\n/);
    let html = "", listType = null; // null | "ul" | "ol"
    const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };
    for (const raw of lines) {
      const line = raw.trim();
      const ul = /^[-*\u2022]\s+(.*)$/.exec(line);
      const ol = /^\d+[.)]\s+(.*)$/.exec(line);
      if (ul) {
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += `<li>${inline(ul[1])}</li>`;
      } else if (ol) {
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += `<li>${inline(ol[1])}</li>`;
      } else {
        closeList();
        if (line) html += `<p>${inline(line)}</p>`;
      }
    }
    closeList();
    return html;
  }

  function notesInlineToText(node) {
    let out = "";
    node.childNodes.forEach((child) => {
      if (child.nodeType === Node.TEXT_NODE) { out += child.textContent; return; }
      if (child.nodeType !== Node.ELEMENT_NODE) return;
      const tag = child.tagName.toLowerCase();
      const inner = notesInlineToText(child);
      if (tag === "b" || tag === "strong") out += `**${inner}**`;
      else if (tag === "i" || tag === "em") out += `*${inner}*`;
      else if (tag === "br") out += "\n";
      else out += inner;
    });
    return out;
  }

  function notesCollectLines(node, lines) {
    node.childNodes.forEach((child) => {
      if (child.nodeType === Node.TEXT_NODE) {
        const t = child.textContent.trim();
        if (t) lines.push(t);
        return;
      }
      if (child.nodeType !== Node.ELEMENT_NODE) return;
      const tag = child.tagName.toLowerCase();
      if (tag === "ul" || tag === "ol") {
        let i = 1;
        child.querySelectorAll(":scope > li").forEach((li) => {
          const prefix = tag === "ol" ? `${i++}. ` : "- ";
          lines.push(prefix + notesInlineToText(li).trim());
        });
      } else if (tag === "li") {
        lines.push("- " + notesInlineToText(child).trim());
      } else if (tag === "p" || tag === "div") {
        if (child.querySelector("ul, ol, li")) {
          notesCollectLines(child, lines);
        } else {
          const t = notesInlineToText(child).trim();
          if (t) lines.push(t);
        }
      } else if (tag !== "br") {
        notesCollectLines(child, lines);
      }
    });
  }

  function notesHtmlToText(el) {
    if (!el) return "";
    const lines = [];
    notesCollectLines(el, lines);
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  // Built as HTML rather than pushed through notesTextToHtml, because the
  // empty answer paragraphs are the point and notesTextToHtml drops blank
  // lines. They survive until save, by which time the ones that matter have
  // something typed in them.
  function guideHtml(guide) {
    const esc = (t) => escapeHtml(t);
    let html = "";
    guide.sections.forEach((pair) => {
      const [heading, questions] = pair;
      html += `<p><strong>${esc(heading.toUpperCase())}</strong></p>`;
      questions.forEach((q) => {
        html += `<p><strong>${esc(q)}</strong></p><p><br></p>`;
      });
    });
    return html;
  }

  // Selectable, editable, dismissable (Greg, 10/26/26), and now read rather
  // than typed into. The panel above the notes IS the guide; the notes stay
  // empty unless the Team Lead wants them.
  //
  //   Selectable   the picker, five built-in sets plus the person's own
  //   Editable     Edit turns the questions into text you can change, add
  //                to and delete, saved to the profile as "My questions"
  //   Dismissable  the x hides it on every engagement and every machine
  //
  // Marking is deliberately NOT saved. Clicking a question strikes it
  // through so a Team Lead can see at a glance what the conversation has
  // already wandered through; it lasts as long as the page does. A record
  // of what was asked is the notetaker's job, not this panel's.
  //
  // The person's own set is stored as "## Heading" lines with plain
  // question lines under them -- its own small format, not the notes'
  // markdown-lite, because a guide is sections of questions and a note is
  // prose. Both are plain text and greppable in the database.
  let guideUserId = null;
  let myGuideSections = null;   // null = they have not saved one
  let guideEditing = false;
  // Holds the notes through a Clear so Undo can put them back. Page-lifetime
  // only; clearing and then reloading is the same as clearing and saving.
  let clearedNotesBackup = null;

  function serializeGuide(sections) {
    return sections.map(([heading, questions]) =>
      "## " + heading + "\n" + questions.join("\n")).join("\n\n");
  }

  function parseGuide(text) {
    const sections = [];
    String(text || "").split(/\r?\n/).forEach((raw) => {
      const line = raw.trim();
      if (!line) return;
      const h = /^##\s+(.*)$/.exec(line);
      if (h) { sections.push([h[1].trim(), []]); return; }
      // A question before any heading gets one, rather than being dropped.
      if (!sections.length) sections.push(["Questions", []]);
      sections[sections.length - 1][1].push(line);
    });
    return sections.filter(([, qs]) => qs.length);
  }

  function guideSetsAvailable() {
    const sets = QUESTION_GUIDES.slice();
    if (myGuideSections && myGuideSections.length) {
      sets.unshift({ id: "__mine", label: "My questions", sections: myGuideSections,
        note: "Your own set. Press Edit to change it." });
    }
    return sets;
  }

  function currentGuideSet() {
    const pick = document.getElementById("guide-pick");
    return guideSetsAvailable().find((g) => g.id === (pick && pick.value));
  }

  function renderGuidePanel() {
    const panel = document.getElementById("guide-panel");
    const set = currentGuideSet();
    if (!panel) return;
    if (!set) { panel.innerHTML = ""; return; }

    panel.innerHTML = set.sections.map(([heading, questions], si) => `
      <details data-section="${si}">
        <summary><span class="gq-heading">${escapeHtml(heading)}</span><span class="gq-count">${questions.length}</span></summary>
        <ul>${questions.map((q) => `<li>${escapeHtml(q)}</li>`).join("")}</ul>
      </details>`).join("");
    panel.classList.remove("editing");
  }

  function setGuideEditing(on) {
    const panel = document.getElementById("guide-panel");
    if (!panel) return;
    guideEditing = on;
    panel.classList.toggle("editing", on);
    document.getElementById("guide-editbar").classList.toggle("hidden", !on);
    document.getElementById("guide-edit").textContent = on ? "Editing…" : "Edit";
    document.getElementById("guide-edit").disabled = on;
    document.getElementById("guide-revert").classList.toggle(
      "hidden", !(on && myGuideSections && myGuideSections.length));

    panel.querySelectorAll("details").forEach((d) => {
      if (on) d.open = true;
      const sum = d.querySelector("summary .gq-heading");
      // setAttribute, not the contentEditable property: the attribute is
      // what the CSS selector [contenteditable] matches, and what a test
      // can see.
      if (sum) {
        if (on) sum.setAttribute("contenteditable", "true");
        else sum.removeAttribute("contenteditable");
      }
      d.querySelectorAll("li").forEach((li) => {
        if (on) li.setAttribute("contenteditable", "true");
        else li.removeAttribute("contenteditable");
        const existing = li.querySelector(".gq-del");
        if (on && !existing) {
          const del = document.createElement("button");
          del.type = "button"; del.className = "gq-del"; del.textContent = "×";
          del.title = "Remove this question";
          del.contentEditable = "false";
          li.appendChild(document.createTextNode(" "));
          li.appendChild(del);
        } else if (!on && existing) {
          existing.remove();
        }
      });
      let add = d.querySelector(".gq-add");
      if (on && !add) {
        add = document.createElement("button");
        add.type = "button"; add.className = "gq-add"; add.textContent = "+ question";
        d.appendChild(add);
      } else if (!on && add) { add.remove(); }
    });

    let addSec = panel.querySelector(".gq-add-section");
    if (on && !addSec) {
      addSec = document.createElement("button");
      addSec.type = "button"; addSec.className = "gq-add-section"; addSec.textContent = "+ heading";
      panel.appendChild(addSec);
    } else if (!on && addSec) { addSec.remove(); }
  }

  function readGuideFromPanel() {
    const panel = document.getElementById("guide-panel");
    const sections = [];
    panel.querySelectorAll("details").forEach((d) => {
      const heading = (d.querySelector("summary .gq-heading").textContent || "").trim();
      const questions = [];
      d.querySelectorAll("li").forEach((li) => {
        const clone = li.cloneNode(true);
        clone.querySelectorAll(".gq-del").forEach((b) => b.remove());
        const t = (clone.textContent || "").trim();
        if (t) questions.push(t);
      });
      if (heading && questions.length) sections.push([heading, questions]);
    });
    return sections;
  }

  function setGuideHidden(hidden) {
    document.getElementById("guide-field").classList.toggle("hidden", hidden);
    document.getElementById("guide-closed").classList.toggle("hidden", !hidden);
  }

  async function saveGuidePref(patch) {
    if (!guideUserId) return true;
    const { error } = await sb.from("users").update(patch).eq("id", guideUserId);
    if (error) { showBanner("Couldn't save that: " + error.message, "error"); return false; }
    return true;
  }

  async function initGuides(profile) {
    const pick = document.getElementById("guide-pick");
    const panel = document.getElementById("guide-panel");
    if (!pick || !panel) return;

    guideUserId = profile ? profile.id : null;
    myGuideSections = profile && profile.discovery_guide ? parseGuide(profile.discovery_guide) : null;

    const fillPicker = (keep) => {
      const sets = guideSetsAvailable();
      pick.innerHTML = sets
        .map((g) => `<option value="${escapeHtml(g.id)}">${escapeHtml(g.label)}</option>`).join("");
      if (keep && sets.some((g) => g.id === keep)) pick.value = keep;
    };
    fillPicker();
    renderGuidePanel();
    setGuideHidden(!!(profile && profile.discovery_guide_hidden));

    pick.addEventListener("change", () => { if (!guideEditing) renderGuidePanel(); });

    // Click a question to strike it through. Not while editing, and not
    // when the click was actually on the little delete button.
    panel.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if (guideEditing || !li || !panel.contains(li)) return;
      li.classList.toggle("covered");
    });

    // --- Expand / collapse ---
    document.getElementById("guide-expand").addEventListener("click", () => {
      const all = Array.from(panel.querySelectorAll("details"));
      const anyClosed = all.some((d) => !d.open);
      all.forEach((d) => { d.open = anyClosed; });
      document.getElementById("guide-expand").textContent = anyClosed ? "Collapse all" : "Expand all";
    });

    // --- Clear (Greg, 10/26/26: "let's add a button to clear the guide too") ---
    // Unmarks everything and closes the headings, so the panel is back to
    // how it looked when the call started. Does not touch the notes or the
    // saved set -- nothing here is destructive.
    document.getElementById("guide-clear").addEventListener("click", () => {
      panel.querySelectorAll("li.covered").forEach((li) => li.classList.remove("covered"));
      panel.querySelectorAll("details").forEach((d) => { d.open = false; });
      document.getElementById("guide-expand").textContent = "Expand all";
    });

    // --- Edit mode ---
    document.getElementById("guide-edit").addEventListener("click", () => {
      // Strikes are about one conversation, not the question list, so
      // they come off when the list itself is what is being worked on.
      panel.querySelectorAll("li.covered").forEach((li) => li.classList.remove("covered"));
      setGuideEditing(true);
    });

    document.getElementById("guide-cancel").addEventListener("click", () => {
      setGuideEditing(false);
      renderGuidePanel();
    });

    panel.addEventListener("click", (e) => {
      if (!guideEditing) return;
      if (e.target.classList.contains("gq-del")) {
        e.target.closest("li").remove();
        return;
      }
      if (e.target.classList.contains("gq-add")) {
        const ul = e.target.closest("details").querySelector("ul");
        const li = document.createElement("li");
        li.setAttribute("contenteditable", "true");
        ul.appendChild(li);
        li.focus();
        return;
      }
      if (e.target.classList.contains("gq-add-section")) {
        const d = document.createElement("details");
        d.open = true;
        d.innerHTML = '<summary><span class="gq-heading" contenteditable="true">New heading</span>'
          + '<span class="gq-count"></span></summary><ul><li contenteditable="true"></li></ul>';
        panel.insertBefore(d, e.target);
        setGuideEditing(true);
        d.querySelector(".gq-heading").focus();
      }
    });

    document.getElementById("guide-save").addEventListener("click", async () => {
      const sections = readGuideFromPanel();
      if (!sections.length) {
        showBanner("Nothing to save — every heading is empty.", "error");
        return;
      }
      const btn = document.getElementById("guide-save");
      btn.disabled = true;
      const ok = await saveGuidePref({ discovery_guide: serializeGuide(sections) });
      btn.disabled = false;
      if (!ok) return;
      myGuideSections = sections;
      setGuideEditing(false);
      fillPicker("__mine");
      pick.value = "__mine";
      renderGuidePanel();
      showBanner("Saved. It is on the picker as “My questions”.", "success");
    });

    document.getElementById("guide-revert").addEventListener("click", async () => {
      if (!confirm("Delete your saved question set and go back to the built-in ones?")) return;
      const ok = await saveGuidePref({ discovery_guide: null });
      if (!ok) return;
      myGuideSections = null;
      setGuideEditing(false);
      fillPicker(QUESTION_GUIDES[0].id);
      renderGuidePanel();
      showBanner("Your set is gone. The built-in ones are still here.", "success");
    });

    // --- Insert into notes, for the Team Leads who do type ---
    document.getElementById("guide-insert").addEventListener("click", () => {
      const set = currentGuideSet();
      const editor = document.getElementById("f-notes");
      if (!set || !editor) return;
      if (editor.textContent.trim() && !confirm(
        "There are already notes here. Add the " + set.label + " questions at the cursor?")) return;
      editor.focus();
      const sel = document.getSelection();
      if (!sel.rangeCount || !editor.contains(sel.anchorNode)) {
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      document.execCommand("insertHTML", false, guideHtml(set));
    });

    // --- Take the questions back out of the notes ---
    // Greg (10/27/26): "we need to be able to remove the questions". Insert
    // was one-way, so a Team Lead who dropped the wrong set in, or who
    // decided mid-call to let the notetaker handle it, had to delete
    // eighty lines by hand.
    //
    // It removes only lines that EXACTLY match a heading or question from
    // one of the known sets -- every set, not just the one showing, since
    // the one inserted may not be the one now picked. Anything typed is
    // left alone, including a question someone edited, because an edited
    // line is no longer the guide's. Conservative on purpose: leaving a
    // line behind costs one keystroke, deleting somebody's note costs the
    // call.
    function knownGuideLines() {
      const set = new Set();
      guideSetsAvailable().forEach((g) => g.sections.forEach(([heading, questions]) => {
        set.add(heading.trim().toUpperCase());
        questions.forEach((q) => set.add(q.trim()));
      }));
      return set;
    }

    document.getElementById("guide-strip").addEventListener("click", () => {
      const editor = document.getElementById("f-notes");
      if (!editor) return;
      const known = knownGuideLines();
      const isGuideLine = (el) => {
        const t = (el.textContent || "").trim();
        if (!t) return false;
        return known.has(t) || known.has(t.toUpperCase());
      };
      const doomed = Array.from(editor.children).filter(isGuideLine);
      if (!doomed.length) {
        notesStatus("No guide questions in the notes.");
        return;
      }
      if (!confirm("Remove " + doomed.length + " guide line"
          + (doomed.length === 1 ? "" : "s") + " from the notes? Anything you typed stays.")) return;
      // Deleting ninety-odd lines makes the document shorter, so the
      // viewport lands somewhere else even with nobody scrolling it. Hold
      // the NOTES FIELD still rather than the scroll offset: that is the
      // thing being looked at, and it is where the typing goes next.
      const anchorTop = editor.getBoundingClientRect().top;
      doomed.forEach((el) => {
        // Take the blank line that was inserted under the question with it,
        // otherwise stripping leaves a column of empty paragraphs.
        const next = el.nextElementSibling;
        if (next && !(next.textContent || "").trim() && next.querySelector("br")) next.remove();
        el.remove();
      });
      window.scrollBy(0, editor.getBoundingClientRect().top - anchorTop);
      notesStatus("Removed " + doomed.length + " guide line"
        + (doomed.length === 1 ? "" : "s") + ".");
      // Straight into typing, which is what the Team Lead cleared the way
      // for. preventScroll, or focus undoes the anchoring just done.
      editor.focus({ preventScroll: true });
    });

    // --- Clear the notes, with the safety catch Greg asked for ---
    // Two things make it safe rather than just slow: it says how much it is
    // about to destroy, and the text goes to a module-level variable so the
    // banner can offer it straight back. The undo lives as long as the page
    // does, which is longer than anybody takes to realise.
    document.getElementById("notes-clear").addEventListener("click", () => {
      const editor = document.getElementById("f-notes");
      if (!editor) return;
      const text = notesHtmlToText(editor);
      if (!text.trim()) { notesStatus("The notes are already empty."); return; }
      const lines = text.split("\n").filter((l) => l.trim()).length;
      const words = text.split(/\s+/).filter(Boolean).length;
      if (!confirm("Clear the notes?\n\n" + lines + " line" + (lines === 1 ? "" : "s")
          + ", " + words + " word" + (words === 1 ? "" : "s")
          + " will be removed from this screen.\n\nNothing is saved until you press Save, "
          + "and Undo clear will bring it back.")) return;
      const clearAnchorTop = editor.getBoundingClientRect().top;
      clearedNotesBackup = editor.innerHTML;
      editor.innerHTML = "";
      const undo = document.getElementById("notes-undo");
      if (undo) undo.classList.remove("hidden");
      window.scrollBy(0, editor.getBoundingClientRect().top - clearAnchorTop);
      notesStatus("Notes cleared.");
      editor.focus({ preventScroll: true });
    });

    document.getElementById("notes-undo").addEventListener("click", () => {
      const editor = document.getElementById("f-notes");
      if (clearedNotesBackup === null || !editor) return;
      const undoAnchorTop = editor.getBoundingClientRect().top;
      editor.innerHTML = clearedNotesBackup;
      clearedNotesBackup = null;
      document.getElementById("notes-undo").classList.add("hidden");
      window.scrollBy(0, editor.getBoundingClientRect().top - undoAnchorTop);
      notesStatus("Notes put back.");
      editor.focus({ preventScroll: true });
    });

    // --- Hide / show ---
    document.getElementById("guide-hide").addEventListener("click", () => {
      setGuideHidden(true);
      saveGuidePref({ discovery_guide_hidden: true });
    });
    document.getElementById("guide-show").addEventListener("click", () => {
      setGuideHidden(false);
      saveGuidePref({ discovery_guide_hidden: false });
    });
  }

  // ---------- Notes toolbar ----------
  const RT_COMMANDS = { bold: "bold", italic: "italic", bullet: "insertUnorderedList", number: "insertOrderedList" };
  // <p> rather than <div> between paragraphs, so what comes back out maps
  // cleanly onto the stored line-per-paragraph format.
  try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) {}

  function rtUpdateToolbar() {
    const toolbar = document.querySelector(".rt-toolbar");
    if (!toolbar) return;
    toolbar.querySelectorAll("button[data-rt]").forEach((b) => {
      let on = false;
      try { on = document.queryCommandState(RT_COMMANDS[b.dataset.rt]); } catch (e) {}
      b.classList.toggle("active", on);
    });
  }
  // mousedown+preventDefault keeps the editor's selection when a button is
  // pressed -- a plain click would blur the editor first and the command
  // would land on nothing.
  document.addEventListener("mousedown", (e) => {
    if (e.target.closest(".rt-toolbar button[data-rt]")) e.preventDefault();
  });
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".rt-toolbar button[data-rt]");
    if (!btn) return;
    const editor = document.getElementById("f-notes");
    if (!editor) return;
    editor.focus();
    document.execCommand(RT_COMMANDS[btn.dataset.rt]);
    rtUpdateToolbar();
  });
  document.addEventListener("selectionchange", () => {
    const sel = document.getSelection();
    if (!sel || !sel.anchorNode) return;
    const host = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    if (host && host.closest && host.closest(".rt-editor")) rtUpdateToolbar();
  });
  // ---------- Paste ----------
  // This used to drop everything to plain text, on the grounds that a
  // paragraph from Word arrives wrapped in fonts, colours and spans that
  // cannot survive the round trip to the stored format. True, and still
  // true -- but it threw out the headings, bullets and numbering with
  // them. Greg (10/26/26), pasting a prepared question list into the
  // Discovery Call notes: "They have been very nicely laid out but when i
  // copy and paste them into the Discovery call form they lose all their
  // nice formatting."
  //
  // The field already does bold, italic, bulleted and numbered lists --
  // that is the whole toolbar. So the answer is not to admit arbitrary
  // HTML, it is to TRANSLATE the clipboard into the four things the field
  // can keep and discard the rest.
  //
  // How, without a second parser: the pasted markup is normalised and then
  // pushed through the two converters this file already has --
  // notesHtmlToText, which is what runs on save, and notesTextToHtml,
  // which is what runs on load. Anything that survives that pair is by
  // definition expressible in the stored format, so what lands in the
  // editor is exactly what will still be there next time the form is
  // opened. No class of paste can look right now and wrong tomorrow.
  //
  // Headings become bold paragraphs, because the stored format has no
  // heading level and a heading that silently flattened to body text is
  // how a structured question list turns into a wall.
  function normalisePastedMarkup(root) {
    root.querySelectorAll("style, script, meta, link, title, head, img, svg").forEach((n) => n.remove());

    // Google Docs wraps an entire copied selection in <b style="font-weight:normal">,
    // which would bold the lot if taken at face value.
    root.querySelectorAll("b[style], strong[style]").forEach((el) => {
      if (/font-weight\s*:\s*(normal|400)/i.test(el.getAttribute("style") || "")) {
        el.replaceWith(...el.childNodes);
      }
    });

    root.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((h) => {
      const text = h.textContent.trim();
      const p = document.createElement("p");
      if (text) {
        const strong = document.createElement("strong");
        strong.textContent = text;
        p.appendChild(strong);
      }
      h.replaceWith(p);
    });

    // Word and Docs carry weight and slant on inline styles rather than in
    // <b> and <i>, so the tags this file understands have to be put back.
    root.querySelectorAll("[style]").forEach((el) => {
      const style = el.getAttribute("style") || "";
      const weight = /font-weight\s*:\s*(bold(?:er)?|[1-9]00)/i.exec(style);
      const bold = !!weight && (/bold/i.test(weight[1]) || Number(weight[1]) >= 600);
      const italic = /font-style\s*:\s*italic/i.test(style);
      el.removeAttribute("style");
      if (!bold && !italic) return;
      let inner = el;
      if (bold) {
        const strong = document.createElement("strong");
        strong.append(...inner.childNodes);
        inner.appendChild(strong);
        inner = strong;
      }
      if (italic) {
        const em = document.createElement("em");
        em.append(...inner.childNodes);
        inner.appendChild(em);
      }
    });
    return root;
  }

  document.addEventListener("paste", (e) => {
    const editor = e.target.closest && e.target.closest(".rt-editor");
    if (!editor) return;
    const clip = e.clipboardData || window.clipboardData;
    const html = clip.getData("text/html");
    const text = clip.getData("text/plain");
    e.preventDefault();

    // A few words dropped into the middle of a sentence stay a few words.
    // Only something with structure in it gets rebuilt as blocks, or every
    // one-line paste would break the paragraph it landed in.
    if (!html && !/[\r\n]/.test(text || "")) {
      document.execCommand("insertText", false, text || "");
      return;
    }

    let rebuilt = "";
    try {
      const holder = document.createElement("div");
      // Plain text still goes through notesTextToHtml, so a list typed as
      // "- one" in a mail client arrives as a list rather than as hyphens.
      holder.innerHTML = html
        ? notesTextToHtml(notesHtmlToText(normalisePastedMarkup(
            new DOMParser().parseFromString(html, "text/html").body)))
        : notesTextToHtml(text);
      rebuilt = holder.innerHTML;
    } catch (err) {
      rebuilt = "";
    }

    if (!rebuilt) {
      document.execCommand("insertText", false, text || "");
      return;
    }
    // insertHTML, not innerHTML: the paste has to land at the cursor and
    // stay undoable.
    document.execCommand("insertHTML", false, rebuilt);
  });

  function htmlToPlainText(html) {
    if (!html) return "";
    const div = document.createElement("div");
    div.innerHTML = html;
    div.querySelectorAll("br").forEach((br) => br.replaceWith("\n"));
    div.querySelectorAll("p, div, li").forEach((el) => el.insertAdjacentText("beforeend", "\n"));
    return (div.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
  }

  const sanitizeFilename = (name) => name.replace(/[^a-zA-Z0-9._-]/g, "_");
  function fileNameFromPath(path) {
    if (!path) return "";
    const last = path.split("/").pop();
    return last.replace(/^\d+-/, "");
  }
  const FILE_TYPE_ICONS = {
    pdf: "\u{1F4D5}",
    doc: "\u{1F4D8}", docx: "\u{1F4D8}",
    xls: "\u{1F4D7}", xlsx: "\u{1F4D7}", csv: "\u{1F4D7}",
    ppt: "\u{1F4D9}", pptx: "\u{1F4D9}",
    png: "\u{1F5BC}\u{FE0F}", jpg: "\u{1F5BC}\u{FE0F}", jpeg: "\u{1F5BC}\u{FE0F}", gif: "\u{1F5BC}\u{FE0F}",
    zip: "\u{1F5C3}\u{FE0F}",
    mp3: "\u{1F3A7}", m4a: "\u{1F3A7}", wav: "\u{1F3A7}",
    mp4: "\u{1F3A5}", mov: "\u{1F3A5}",
  };
  function fileIconFor(path) {
    const name = (path.split("/").pop() || "").toLowerCase();
    const dot = name.lastIndexOf(".");
    const ext = dot === -1 ? "" : name.slice(dot + 1);
    return FILE_TYPE_ICONS[ext] || "\u{1F4C4}";
  }

  function redirectToLogin() {
    const dest = location.pathname.split("/").pop() + location.search;
    location.href = "index.html?return=" + encodeURIComponent(dest);
  }

  // The scroll is opt-out now (Greg, 10/27/26): "when you click remove
  // questions it pops the page back to the top to show this message which
  // is not needed. i want the screen to stay where it is so i can start
  // taking notes."
  //
  // It is right for Save, where the banner IS the answer and the page is
  // finished with. It is wrong for anything done in the middle of the
  // form, which throws away the reader's place to deliver news they did
  // not ask for. Those actions report through notesStatus instead, which
  // puts the word next to the button that was pressed.
  function showBanner(message, type, scroll) {
    const el = $("banner");
    el.textContent = message;
    el.className = type;
    if (scroll !== false) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // A quiet line in the notes toolbar for things that happen in place.
  // Clears itself, so it never becomes furniture.
  let notesStatusTimer = null;
  function notesStatus(message) {
    const el = document.getElementById("notes-status");
    if (!el) return;
    el.textContent = message || "";
    clearTimeout(notesStatusTimer);
    if (message) notesStatusTimer = setTimeout(() => { el.textContent = ""; }, 5000);
  }

  let currentClient = null;
  let contentRow = null;

  // Every field on this form is editable (Greg, 8/31/26: "all fields in
  // this form need to be editable"). The first time the form is opened
  // for a client, each field defaults to the live value pulled from the
  // client/Application; once the Team Lead saves, their edited value is
  // what loads next time (it won't get silently overwritten by later
  // changes elsewhere) -- same as any other fillable form.
  function fieldValue(saved, liveDefault) {
    return (saved !== null && saved !== undefined && saved !== "") ? saved : (liveDefault || "");
  }

  // ---------- CC List (Greg, 8/31/26) ----------
  // "one row = 1 person = 3 fields per person. Add Row button." -- a real
  // repeatable row editor (Name/Title/Email inputs, not one comma-joined
  // line of freeform text). Saved as JSON in the same discovery_cc_list
  // snapshot column as before (still just this form's own copy -- editing
  // it here doesn't write back to the Company page's CC List table,
  // client_cc_list, same one-way relationship every other field on this
  // form has with its live source).
  let ccListRows = [];

  function parseCcListSnapshot(raw) {
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map((r) => ({ name: r.name || "", title: r.title || "", email: r.email || "" }));
    } catch (e) {
      // Ignore -- fall through to null so the caller uses the live default instead.
    }
    return null;
  }

  function renderCcListRows() {
    const container = $("cc-list-rows");
    container.innerHTML = ccListRows.map((row, i) => `
      <div class="cc-row" data-row-index="${i}">
        <div class="field"><label>Name</label><input type="text" data-cc-field="name" value="${escapeAttr(row.name)}" /></div>
        <div class="field"><label>Title</label><input type="text" data-cc-field="title" value="${escapeAttr(row.title)}" /></div>
        <div class="field"><label>Email</label><input type="email" data-cc-field="email" value="${escapeAttr(row.email)}" /></div>
        <button type="button" class="cc-row-remove" data-cc-remove title="Remove this person">&times;</button>
      </div>
    `).join("");
    container.querySelectorAll("[data-cc-field]").forEach((inp) => {
      inp.addEventListener("input", () => {
        const i = Number(inp.closest("[data-row-index]").dataset.rowIndex);
        ccListRows[i][inp.dataset.ccField] = inp.value;
      });
    });
    container.querySelectorAll("[data-cc-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const i = Number(btn.closest("[data-row-index]").dataset.rowIndex);
        ccListRows.splice(i, 1);
        if (!ccListRows.length) ccListRows.push({ name: "", title: "", email: "" });
        renderCcListRows();
      });
    });
  }

  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  $("cc-list-add-row").addEventListener("click", () => {
    ccListRows.push({ name: "", title: "", email: "" });
    renderCcListRows();
    const rows = $("cc-list-rows").querySelectorAll("[data-cc-field='name']");
    if (rows.length) rows[rows.length - 1].focus();
  });

  // ---------- Attach a File or Link for Call Notes (Greg, 8/31/26) ----------
  // Same upload-or-link + Change-menu pattern as the Workflow Files page:
  // one "+ Add file" trigger opening {Upload file, Add a link} in the
  // empty state, one "Change" trigger opening {Replace/Edit, Remove}
  // once something's attached. Saves straight to client_content the
  // moment a file/link is picked -- independent of the Save Notes
  // button, which only covers the typed fields.
  function closeAllWfMenus() {
    document.querySelectorAll(".wf-menu").forEach((m) => m.classList.add("hidden"));
  }
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".wf-change-wrap")) closeAllWfMenus();
  });
  function wireWfChangeMenu(container, actions) {
    const trigger = container.querySelector("[data-wf-change]");
    const menu = container.querySelector(".wf-menu");
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasHidden = menu.classList.contains("hidden");
      closeAllWfMenus();
      menu.classList.toggle("hidden", !wasHidden);
    });
    actions.forEach(({ sel, fn }) => {
      menu.querySelector(sel).addEventListener("click", () => { closeAllWfMenus(); fn(); });
    });
  }

  function renderNotesAttachment() {
    const container = $("notes-attachment");
    const path = contentRow && contentRow.discovery_doc_storage_path;
    const url = contentRow && contentRow.discovery_doc_url;

    if (path) {
      container.innerHTML = `
        <div class="wf-file-cell">
          <span class="wf-file-link">${fileIconFor(path)} ${escapeHtml(fileNameFromPath(path))}</span>
          <div class="wf-change-wrap">
            <button type="button" class="wf-btn" data-wf-change>Change &#9662;</button>
            <div class="wf-menu hidden">
              <button type="button" data-wf-replace>Replace file</button>
              <button type="button" class="wf-menu-danger" data-wf-remove>Remove file</button>
            </div>
          </div>
        </div>
      `;
      container.querySelector(".wf-file-link").addEventListener("click", async () => {
        const { data, error } = await sb.storage.from("client-documents").createSignedUrl(path, 60);
        if (error) { showBanner("Couldn't open file: " + error.message, "error"); return; }
        window.open(data.signedUrl, "_blank");

      wireWfChangeMenu(container, [
        { sel: "[data-wf-replace]", fn: () => pickNotesFile() },
        { sel: "[data-wf-remove]", fn: () => removeNotesAttachment() },
      ]);
      return;
    }

    if (url) {
      container.innerHTML = `
        <div class="wf-file-cell">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="wf-file-link" style="text-decoration:none; word-break:break-all;">&#128279; ${escapeHtml(url)}</a>
          <div class="wf-change-wrap">
            <button type="button" class="wf-btn" data-wf-change>Change &#9662;</button>
            <div class="wf-menu hidden">
              <button type="button" data-wf-edit-link>Edit link</button>
              <button type="button" class="wf-menu-danger" data-wf-remove>Remove link</button>
            </div>
          </div>
        </div>
      `;
      wireWfChangeMenu(container, [
        { sel: "[data-wf-edit-link]", fn: () => renderNotesLinkForm(url) },
        { sel: "[data-wf-remove]", fn: () => removeNotesAttachment() },
      ]);
      return;
    }

    container.innerHTML = `
      <div class="wf-change-wrap">
        <button type="button" class="wf-btn" data-wf-change>+ Add file &#9662;</button>
        <div class="wf-menu hidden">
          <button type="button" data-wf-upload>Upload file</button>
          <button type="button" data-wf-add-link>Add a link</button>
        </div>
      </div>
      <input type="file" class="wf-upload-input hidden" />
    `;
    container.querySelector(".wf-upload-input").addEventListener("change", (e) => {
      if (e.target.files.length) uploadNotesFile(e.target.files[0]);
    });
    wireWfChangeMenu(container, [
      { sel: "[data-wf-upload]", fn: () => container.querySelector(".wf-upload-input").click() },
      { sel: "[data-wf-add-link]", fn: () => renderNotesLinkForm("") },
    ]);
  }

  function renderNotesLinkForm(currentUrl) {
    const container = $("notes-attachment");
    container.innerHTML = `
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="url" class="wf-link-input" value="${escapeHtml(currentUrl)}" placeholder="https://…" style="flex:1; min-width:200px; padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;" />
        <button type="button" class="save-row-btn" data-wf-save-link style="font-family:inherit; cursor:pointer; border:none; border-radius:6px; font-size:13px; padding:8px 16px; font-weight:600; background:var(--accent); color:#fff;">Save</button>
        <button type="button" data-wf-cancel-link style="font-family:inherit; cursor:pointer; border:1.5px solid var(--border); border-radius:6px; font-size:13px; padding:8px 16px; font-weight:600; background:#fff; color:var(--text);">Cancel</button>
      </div>
    `;
    const input = container.querySelector(".wf-link-input");
    input.focus();
    container.querySelector("[data-wf-save-link]").addEventListener("click", () => saveNotesLink(input.value.trim()));
    container.querySelector("[data-wf-cancel-link]").addEventListener("click", () => renderNotesAttachment());
  }

  async function saveNotesLink(url) {
    if (!url) { showBanner("Enter a URL first.", "error"); return; }
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const { error } = await sb.from("client_content").update({ discovery_doc_url: url, discovery_doc_storage_path: null }).eq("client_id", currentClient.id);
    if (error) { showBanner("Couldn't save the link: " + error.message, "error"); return; }
    contentRow.discovery_doc_url = url;
    contentRow.discovery_doc_storage_path = null;
    renderNotesAttachment();
    showBanner("Link saved.", "success");
  }

  function pickNotesFile() {
    const picker = document.createElement("input");
    picker.type = "file";
    picker.addEventListener("change", () => { if (picker.files.length) uploadNotesFile(picker.files[0]); });
    picker.click();
  }

  async function uploadNotesFile(file) {
    const oldPath = contentRow && contentRow.discovery_doc_storage_path;
    const path = `clients/${currentClient.id}/workflow/discovery/${Date.now()}-${sanitizeFilename(file.name)}`;
    const { error: uploadErr } = await sb.storage.from("client-documents").upload(path, file);
    if (uploadErr) { showBanner("Couldn't upload file: " + uploadErr.message, "error"); return; }
    const { error } = await sb.from("client_content").update({ discovery_doc_storage_path: path, discovery_doc_url: null }).eq("client_id", currentClient.id);
    if (error) { showBanner("Couldn't save file: " + error.message, "error"); return; }
    if (oldPath) await sb.storage.from("client-documents").remove([oldPath]);
    contentRow.discovery_doc_storage_path = path;
    contentRow.discovery_doc_url = null;
    renderNotesAttachment();
    showBanner("File uploaded.", "success");
  }

  async function removeNotesAttachment() {
    const oldPath = contentRow && contentRow.discovery_doc_storage_path;
    const { error } = await sb.from("client_content").update({ discovery_doc_storage_path: null, discovery_doc_url: null }).eq("client_id", currentClient.id);
    if (error) { showBanner("Couldn't remove it: " + error.message, "error"); return; }
    if (oldPath) await sb.storage.from("client-documents").remove([oldPath]);
    contentRow.discovery_doc_storage_path = null;
    contentRow.discovery_doc_url = null;
    renderNotesAttachment();
    showBanner("Attachment removed.", "success");
  }

  async function loadClient(clientId) {
    const { data: client, error } = await sb.from("clients").select("*").eq("id", clientId).single();
    if (error || !client) {
      $("no-client-view").classList.remove("hidden");
      showBanner("Couldn't load that engagement — you may not be assigned to it.", "error");
      return;
    }
    currentClient = client;

    const [{ data: content }, { data: contacts }, { data: ccList }, { data: team }, { data: partnerSelections }, partnerRes] = await Promise.all([
      sb.from("client_content").select("*").eq("client_id", clientId).maybeSingle(),
      sb.from("client_contacts").select("*").eq("client_id", clientId),
      sb.from("client_cc_list").select("*").eq("client_id", clientId).order("sort_order").order("created_at"),
      sb.from("client_assignments").select("id, is_team_lead, users(full_name, email)").eq("client_id", clientId).not("user_id", "is", null).order("is_team_lead", { ascending: false }),
      // Every Program contact ticked for this engagement, for either
      // reason. Yesterday this was two tables and this form read only one of
      // them, which is why Fuel Efficiency showed no Program Manager while
      // two contacts sat ticked on it; 163 merged them.
      sb.from("client_partner_contacts").select("partner_contact_id").eq("client_id", clientId),
      client.econ_dev_company_id
        ? sb.from("econ_dev_companies").select("name").eq("id", client.econ_dev_company_id).single()
        : Promise.resolve({ data: null }),
    ]);
    contentRow = content || {};

    const leadRow = (team || []).find((r) => r.is_team_lead && r.users && r.users.full_name);
    const teamLead = leadRow ? [leadRow.users.full_name, leadRow.users.email].filter(Boolean).join(", ") : "";
    const contactLines = (contacts || []).map((c) => [c.name, c.title, c.email, c.phone].filter(Boolean).join(", ")).join("\n");
    // Greg (8/31/26): "i need to be able to add a few people to cc list on
    // an engagement... one line per cc person with fields name title
    // email." Same live-default pattern as Company Contacts above --
    // pre-fills from the CC List maintained on the Company page
    // (client_cc_list, Client Info > Info Wizard > Contacts step) the first time
    // this form is opened; a saved snapshot here takes precedence after
    // that, same as every other field on this form.
    const liveCcListRows = (ccList || []).map((c) => ({ name: c.name || "", title: c.title || "", email: c.email || "" }));

    // Greg (8/31/26): "make sure the Program Manager and Address flow
    // through from the application." Program Manager is the Program
    // Contact picked on the original Application (program_contact_id),
    // which accept_client_application() (056) copies onto
    // client_partner_contacts (163) -- NOT the application's freeform
    // cc_emails (that's a separate, email-only field used elsewhere for
    // the Close-Out Evaluation email's CC line). This looks the contact
    // up the same two-step way client_profile.html's Team section does:
    // selected partner_contact_id's first, then the real contact rows.
    const partnerContactIds = [...new Set((partnerSelections || []).map((x) => x.partner_contact_id).filter(Boolean))];
    let programManager = "";
    let programCcRows = [];
    if (partnerContactIds.length) {
      const { data: partnerContacts } = await sb
        .from("econ_dev_partner_contacts")
        .select("id, name, title, email, phone, is_program_administrator, sort_order")
        .in("id", partnerContactIds);
      const rows = (partnerContacts || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      // The Program Manager line is ONE person: the Program Administrator
      // if this engagement has one ticked, otherwise the first contact. It
      // used to list every ticked contact, one per line, which is how a
      // single-line field ended up trying to hold a whole CC list.
      const pa = rows.find((c) => c.is_program_administrator) || rows[0] || null;
      if (pa) programManager = [pa.name, pa.title, pa.email, pa.phone].filter(Boolean).join(", ");
      // Everyone else ticked for this engagement is who gets copied, so
      // they are the CC List's live default.
      programCcRows = rows
        .filter((c) => !pa || c.id !== pa.id)
        .map((c) => ({ name: c.name || "", title: c.title || "", email: c.email || "" }));
    }

    // Same as controlling_document.html (Greg, 10/13/26): the way back is
    // the engagement you came from, named, not the document you are already
    // looking at on a page you were not on.
    $("back-link").href = `client_control_center.html?client=${client.id}`;
    $("back-link").textContent = `\u2190 Back to ${client.name || "the engagement"}`;
    $("lh-company-name").textContent = client.name || "";
    document.title = `Discovery Call Notes — ${client.name || ""}`;

    const programName = (partnerRes && partnerRes.data && partnerRes.data.name) || "";
    const desc = htmlToPlainText(client.description);
    const issues = htmlToPlainText(client.top_business_issues);

    $("f-company-name").value = fieldValue(contentRow.discovery_company_name, client.name);
    $("f-team-lead").value = fieldValue(contentRow.discovery_team_lead, teamLead);
    $("f-program-name").value = fieldValue(contentRow.discovery_program_name, programName);
    $("f-program-manager").value = fieldValue(contentRow.discovery_program_manager, programManager);
    $("f-company-address").value = fieldValue(contentRow.discovery_company_address, client.address);
    // client_cc_list is the engagement's own hand-kept CC list and is empty
    // on every engagement so far, so this table was always blank. Falling
    // back to the Program contacts ticked for the engagement fills it with
    // the people who are in fact copied on this client's correspondence.
    ccListRows = parseCcListSnapshot(contentRow.discovery_cc_list)
      || (liveCcListRows.length ? liveCcListRows : programCcRows);
    if (!ccListRows.length) ccListRows = [{ name: "", title: "", email: "" }];
    renderCcListRows();
    $("f-company-contacts").value = fieldValue(contentRow.discovery_company_contacts, contactLines);
    $("f-website-url").value = fieldValue(contentRow.discovery_website_url, client.website_url);
    $("f-facebook-url").value = fieldValue(contentRow.discovery_facebook_url, client.facebook_url);
    $("f-linkedin-url").value = fieldValue(contentRow.discovery_linkedin_url, client.linkedin_url);
    $("f-twitter-url").value = fieldValue(contentRow.discovery_twitter_url, client.twitter_url);
    $("f-youtube-url").value = fieldValue(contentRow.discovery_youtube_url, client.youtube_url);
    $("f-instagram-url").value = fieldValue(contentRow.discovery_instagram_url, client.instagram_url);
    $("f-other-social-url").value = fieldValue(contentRow.discovery_other_social_url, client.other_social_url);
    $("f-company-description").value = fieldValue(contentRow.discovery_company_description, desc);
    $("f-business-issues").value = fieldValue(contentRow.discovery_business_issues, issues);

    $("f-call-date").value = contentRow.discovery_call_date || "";
    $("f-call-link").value = contentRow.discovery_call_link || "";
    $("f-participants").value = contentRow.discovery_call_participants || "";
    $("f-notes").innerHTML = notesTextToHtml(contentRow.discovery_call_notes || "");
    if (contentRow.discovery_call_notes || contentRow.discovery_call_participants) {
      $("save-hint").textContent = "Previously saved notes loaded below.";
    }
    renderNotesAttachment();

    $("form-view").classList.remove("hidden");
  }

  $("print-btn").addEventListener("click", () => window.print());

  $("save-btn").addEventListener("click", async () => {
    const btn = $("save-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    try {
      const payload = {
        discovery_call_date: $("f-call-date").value || null,
        discovery_call_link: $("f-call-link").value.trim() || null,
        discovery_call_participants: $("f-participants").value,
        discovery_call_notes: notesHtmlToText($("f-notes")),
        discovery_team_lead: $("f-team-lead").value,
        discovery_program_name: $("f-program-name").value,
        discovery_company_name: $("f-company-name").value,
        discovery_company_address: $("f-company-address").value,
        discovery_cc_list: JSON.stringify(ccListRows.filter((r) => r.name || r.title || r.email)),
        discovery_company_contacts: $("f-company-contacts").value,
        discovery_program_manager: $("f-program-manager").value,
        discovery_company_description: $("f-company-description").value,
        discovery_business_issues: $("f-business-issues").value,
        discovery_website_url: $("f-website-url").value.trim() || null,
        discovery_facebook_url: $("f-facebook-url").value.trim() || null,
        discovery_linkedin_url: $("f-linkedin-url").value.trim() || null,
        discovery_twitter_url: $("f-twitter-url").value.trim() || null,
        discovery_youtube_url: $("f-youtube-url").value.trim() || null,
        discovery_instagram_url: $("f-instagram-url").value.trim() || null,
        discovery_other_social_url: $("f-other-social-url").value.trim() || null,
      };

      // Greg (8/31/26): "when i go back and look at the Workflow Documents
      // page it is not showing up... perhaps we should hit a submit
      // button instead of save." Submitting is what makes this show up
      // in Project Files as the Discovery Document -- if nothing's been
      // manually attached yet via "Attach a File or Link" above, submit
      // links the Discovery Document back to this filled-out form itself
      // (a real attachment there always takes precedence and is left
      // alone).
      if (!contentRow.discovery_doc_storage_path && !contentRow.discovery_doc_url) {
        const selfLink = new URL(location.pathname, location.origin);
        selfLink.search = `?client=${currentClient.id}`;
        payload.discovery_doc_url = selfLink.toString();
      }

      const { error } = await sb.from("client_content").update(payload).eq("client_id", currentClient.id);
      if (error) { showBanner("Couldn't submit: " + error.message, "error"); return; }
      Object.assign(contentRow, payload);
      renderNotesAttachment();
      showBanner("Discovery Call Notes submitted -- it now shows up in Project Files.", "success");
      $("save-hint").textContent = "Submitted.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit Discovery Call Notes";
    }
  });

  async function afterSignIn() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;

    const { data: profile, error: profileErr } = await sb.from("users")
      .select("id, full_name, role, discovery_guide, discovery_guide_hidden")
      .eq("id", user.id).single();
    if (profileErr || !profile) {
      await sb.auth.signOut();
      redirectToLogin();
      return;
    }

    $("loading-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    initGuides(profile);

    const clientId = new URLSearchParams(location.search).get("client");
    if (clientId) {
      await loadClient(clientId);
    } else {
      location.href = "index.html";
    }
  }

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      afterSignIn();
    } else {
      redirectToLogin();
    }
  });
</script>
</body>
</html>
