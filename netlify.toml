# Shortens the client-facing dashboard link from
#   /client_public.html?slug=clippardinstrumentlabs
# to
#   /c/clippardinstrumentlabs
# Purely additive -- the old ?slug= links keep working exactly as before,
# this just adds a second, prettier way to reach the same page. Once a real
# custom domain with wildcard DNS is set up (see client_public.html's
# resolveSlug()), client links can move to name.egdashboardbuilder.com
# instead -- this redirect isn't a dependency for that, just a stopgap.
[[redirects]]
  from = "/c/:slug"
  to = "/client_public.html?slug=:slug"
  status = 200
