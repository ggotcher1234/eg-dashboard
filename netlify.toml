# Greg (10/3/26): the review punch list, at
#
#   egdb.netlify.app/punchlist
#
# It began as a claude.ai artifact, which meant Chris and Rita each needed
# a Claude account and an invitation before the link would open for them --
# "that will be too confusing for chris. let's change this from an artifact
# to an html app with the same url that will not need a Claude account to
# access." So it is a page in this repo now, reading and writing
# punchlist_items / punchlist_comments (migration 136) with the same
# publishable key the other public pages use. No sign-in of any kind.
#
# status 200, a rewrite rather than a redirect, so the address bar keeps
# saying /punchlist instead of flashing over to /punchlist.html -- the same
# reasoning as /apply/:code above.
#
# Both spellings are listed because Netlify matches redirect paths exactly
# and /punchlist/ would otherwise 404.
[[redirects]]
  from = "/punchlist"
  to = "/punchlist.html"
  status = 200
[[redirects]]
  from = "/punchlist/"
  to = "/punchlist.html"
  status = 200
