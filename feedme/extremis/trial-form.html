<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FeedMe Pro — trial request (form detection)</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <!--
    Static copy of the "Start Your 30-Day Free Trial" form so Netlify Forms
    detects it at deploy time. Nobody navigates here. The real submission is
    an AJAX POST from the trial modal in index.html using the same
    form-name ("feedme-pro-trial"); Netlify matches submissions to this
    detected form.
  -->
  <form name="feedme-pro-trial" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="feedme-pro-trial">
    <p hidden><label>Leave blank: <input name="bot-field"></label></p>
    <label>Name <input type="text" name="name"></label>
    <label>Company <input type="text" name="company"></label>
    <label>Email <input type="email" name="email"></label>
    <label>Phone <input type="tel" name="phone"></label>
    <button type="submit">Send</button>
  </form>
</body>
</html>
